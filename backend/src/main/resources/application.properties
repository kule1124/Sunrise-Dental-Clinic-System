spring.application.name=sunrise-dental-clinic

# WAMP MySQL database. Override these values with environment variables when
# the API runs outside the WAMP/VMware machine.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sunrise_dental_clinic?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:8080}
